name: Deploy (production)

on:
  push:
    branches: [master]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    # The admin email and public hostnames are secrets rather than variables:
    # this repo is public, so a variable would be expanded verbatim into these
    # logs, while secret values are masked. They are hoisted to the job here
    # because the `secrets` context is not available in step `if:` conditions —
    # only `env` is.
    env:
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      SITE_DOMAIN: ${{ secrets.SITE_DOMAIN }}
      PAGES_ORIGIN: ${{ secrets.PAGES_ORIGIN }}
      WORKOUT_RULE_SET_NAME: ${{ secrets.WORKOUT_RULE_SET_NAME }}
      # GH_USER, not GITHUB_USER: GitHub reserves the GITHUB_ prefix for
      # secret names and refuses to create one using it.
      GH_USER: ${{ secrets.GH_USER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN_PROD }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy production stack
        run: >-
          npx cdk deploy PortfolioApiStack-prod --context stage=prod
          --context githubUser="$GH_USER"
          --context adminEmail="$ADMIN_EMAIL"
          --context siteDomain="$SITE_DOMAIN"
          --context pagesOrigin="$PAGES_ORIGIN"
          --require-approval never

      # Workout ingestion lives in us-west-2 and attaches to kotlin-ses-forward's
      # SES rule set. Only runs once WORKOUT_RULE_SET_NAME is set, so the pipeline
      # is safe to merge before that infra exists.
      #
      # Every context value the *app* needs must be passed here, not just the
      # ones this stack reads: `cdk deploy` synthesises the whole app, so
      # PortfolioApiStack-prod is constructed too and demands pagesOrigin even
      # when the workout stack is the only deploy target.
      - name: Deploy workout ingest stack
        if: env.WORKOUT_RULE_SET_NAME != ''
        run: >-
          npx cdk deploy WorkoutIngestStack-prod --context stage=prod
          --context githubUser="$GH_USER"
          --context adminEmail="$ADMIN_EMAIL"
          --context siteDomain="$SITE_DOMAIN"
          --context pagesOrigin="$PAGES_ORIGIN"
          --context workoutRuleSetName="$WORKOUT_RULE_SET_NAME"
          --require-approval never
